<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Beautiful Memories ❤️</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

</head>

<body>

<!-- Hearts -->

<div class="hearts">
    <span>❤️</span>
    <span>💖</span>
    <span>💕</span>
    <span>💗</span>
    <span>💝</span>
    <span>💞</span>
</div>

<!-- Balloons -->

<div class="balloons">
    <span>🎈</span>
    <span>🎈</span>
    <span>🎈</span>
    <span>🎈</span>
    <span>🎈</span>
    <span>🎈</span>
</div>

<div class="memory-card">

<h1>📸 Beautiful Memories ❤️</h1>

<img id="slide" src="photos/photo1.jpeg" class="memory-photo">

<p id="caption">

Every picture tells a beautiful story... ❤️

</p>

<div class="dots">

    <span class="dot active"></span>
    <span class="dot"></span>
    <span class="dot"></span>
    <span class="dot"></span>
    <span class="dot"></span>
    <span class="dot"></span>
    <span class="dot"></span>
    <span class="dot"></span>
    <span class="dot"></span>
    <span class="dot"></span>
    <span class="dot"></span>
    <span class="dot"></span>
    <span class="dot"></span>

</div>

<button id="continueBtn" class="hidden">

💖 Continue

</button>

</div>

<audio id="birthdayMusic" autoplay>
<source src="music/birthday.mp3" type="audio/mpeg">
</audio>

<script src="memories.js"></script>

</body>

</html>
