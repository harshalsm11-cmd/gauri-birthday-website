<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dear Gauri ❤️</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

</head>

<body>

<!-- Hearts -->

<div class="hearts">

    <span>❤️</span>
    <span>💖</span>
    <span>💕</span>
    <span>💗</span>
    <span>💝</span>
    <span>💞</span>

</div>


<!-- Balloons -->

<div class="balloons">

    <span>🎈</span>
    <span>🎈</span>
    <span>🎈</span>
    <span>🎈</span>
    <span>🎈</span>
    <span>🎈</span>

</div>


<div class="letter-card">

    <h1>💌 Dear Gauri</h1>

    <img src="images/panda.gif" class="panda">


    <!-- =========================
            MINI GAME
    ========================== -->

    <div id="quiz">

        <h2 class="question">
            🐼 Let's Play A Little Game!
        </h2>

        <p id="quizQuestion">

            Question will appear here

        </p>


        <div class="quiz-options">

            <button class="optionBtn"></button>

            <button class="optionBtn"></button>

            <button class="optionBtn"></button>

            <button class="optionBtn"></button>

        </div>


        <p id="quizResult"></p>

    </div>


    <!-- =========================
          YES / NO QUESTION
    ========================== -->

    <div id="nextQuestion" class="hidden">

        <hr>

        <h2 class="question">

            🐼 One Last Question...

        </h2>


        <p class="questionText">

            Can we go to the next page? 💖

        </p>


        <div class="buttons">

            <button id="yesBtn">

                😊 YES

            </button>


            <button id="noBtn">

                😝 NO

            </button>

        </div>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

<script src="letter.js"></script>


</body>

</html>
