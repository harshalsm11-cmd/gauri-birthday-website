<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Celebrate 🎉</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

</head>

<body>

<!-- Floating Hearts -->

<div class="hearts">
    <span>❤️</span>
    <span>💖</span>
    <span>💕</span>
    <span>💗</span>
    <span>💝</span>
    <span>💞</span>
</div>


<!-- Floating Balloons -->

<div class="balloons">
    <span>🎈</span>
    <span>🎈</span>
    <span>🎈</span>
    <span>🎈</span>
    <span>🎈</span>
    <span>🎈</span>
</div>


<!-- Celebration Box -->

<div class="celebrateBox">

    <h1>🎉 Happy Birthday Once Again! 🎉</h1>

    <p class="celebrateName">
        Gauri ❤️
    </p>

    <img src="images/panda.gif" class="panda" alt="Birthday Panda">

    <img src="images/cake.png" class="cake" alt="Birthday Cake">

    <h2>🥳 Today Is Your Day!</h2>

    <p class="celebrateText">

        Smile... 😊<br>
        Laugh... 😂<br>
        Enjoy every moment... 💖<br>
        and make today unforgettable. ✨

    </p>

    <p class="specialText">
        Because you deserve a day full of happiness! 🥹❤️
    </p>

    <button id="giftBtn">

        🎁 Open Your Birthday Gift

    </button>

</div>


<!-- Confetti -->

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

<script src="celebrate.js"></script>

</body>

</html>
